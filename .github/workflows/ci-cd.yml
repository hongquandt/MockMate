name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- BACKEND CI ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore Backend dependencies
        run: dotnet restore ./src/BE/InterviewSimulator/InterviewSimulator.sln
        
      - name: Build Backend
        run: dotnet build ./src/BE/InterviewSimulator/InterviewSimulator.sln -c Release --no-restore
        
      # - name: Test Backend
      #   run: dotnet test ./src/BE/InterviewSimulator/InterviewSimulator.sln -c Release --no-build --verbosity normal

      # --- FRONTEND CI ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './src/FE/MockMate/package-lock.json'
          
      - name: Install Frontend dependencies
        working-directory: ./src/FE/MockMate
        run: npm ci
        
      # - name: Lint Frontend
      #   working-directory: ./src/FE/MockMate
      #   run: npm run lint
        
      - name: Build Frontend
        working-directory: ./src/FE/MockMate
        run: npm run build

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: type=sha,format=long

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/BE/InterviewSimulator/InterviewSimulator
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: type=sha,format=long

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/FE/MockMate
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    name: Deploy to Server
    needs: build-and-push-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Pull the latest images
            docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:sha-${{ github.sha }}
            docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:sha-${{ github.sha }}
            
            # Update docker-compose file manually or sed commands to replace image tags
            # Alternatively, if env vars are used in docker-compose.yml:
            # echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:sha-${{ github.sha }}" > .env
            # echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:sha-${{ github.sha }}" >> .env
            
            # Restart containers
            cd /path/to/your/project
            docker-compose up -d --build
